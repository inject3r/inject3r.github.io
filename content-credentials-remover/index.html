<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0"
    />
    <title>Content Credentials Remover · C2PA Cleaner</title>
    <meta
      name="description"
      content="Remove Content Credentials (C2PA) metadata from images. Client-side, privacy-first, with metadata preview. Accepts JPG, PNG, WebP, GIF, BMP, TIFF, AVIF."
    />
    <link
      rel="canonical"
      href="https://github.com/inject3r/content-credentials-remover"
    />
    <meta property="og:title" content="Content Credentials Remover" />
    <meta
      property="og:description"
      content="Strip C2PA metadata from images. Preview metadata, download individually or all at once."
    />
    <meta
      property="og:url"
      content="https://github.com/inject3r/inject3r/content-credentials-remover"
    />
    <meta name="robots" content="index, follow" />
    <link rel="stylesheet" href="styles.css" media="all" />
  </head>
  <body>
    <div class="container">
      <div class="header">
        <div class="header-left">
          <h1>Content Credentials Remover</h1>
          <span class="badge">C2PA</span>
        </div>
        <a
          class="github-link"
          href="https://github.com/inject3r/content-credentials-remover"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="GitHub repository"
        >
          <svg width="20" height="20" viewBox="0 0 16 16" fill="currentColor">
            <path
              d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"
            />
          </svg>
          <span>source</span>
        </a>
      </div>
      <div class="subhead">
        Strip metadata · client-side · preview C2PA info
      </div>

      <div class="upload-zone" id="uploadZone" role="button" tabindex="0">
        <div class="upload-icon">
          <svg
            width="48"
            height="48"
            viewBox="0 0 24 24"
            fill="none"
            stroke="#2563eb"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
            <polyline points="17 8 12 3 7 8" />
            <line x1="12" y1="3" x2="12" y2="15" />
          </svg>
        </div>
        <h3>Drop images here or click to browse</h3>
        <p>JPG, PNG, WebP, GIF, BMP, TIFF, AVIF · multiple files</p>
        <div class="allowed-types">
          SVG, ZIP, and other files are not accepted
        </div>
        <input type="file" id="fileInput" accept="image/*" multiple />
      </div>

      <div id="galleryContainer" style="display: none">
        <div class="gallery-grid" id="gallery"></div>
        <div class="action-bar">
          <div class="stats">
            <strong id="imageCount">0</strong> images ·
            <strong id="cleanedCount">0</strong> cleaned
          </div>
          <div style="display: flex; gap: 0.5rem; flex-wrap: wrap">
            <button class="btn btn-success" id="processAllBtn">
              Process All
            </button>
            <button class="btn btn-primary" id="downloadAllBtn">
              Download All
            </button>
            <button class="btn btn-danger" id="clearAllBtn">Clear All</button>
          </div>
        </div>
      </div>

      <div class="footer">Content Credentials Remover | v0.1.0</div>
    </div>

    <div id="toast" class="toast"></div>

    <script src="scripts.js"></script>
  </body>
</html>
